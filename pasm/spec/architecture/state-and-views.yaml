entities:
  - state: authoritative-game-state
    core:
      status: proposed
      confidence: confirmed
      title: Authoritative Game State
      summary: >-
        One plain JSON-serialisable object holding the whole game — phase and
        clock, seats, roles and their resources, the eighteen shires, the
        battle in progress, votes, envoy threads, and the command log.
      rationale:
        - Plain objects rather than classes so structured cloning, saving to local storage, exporting to a file and deep-equality assertions all come for free.
        - Derived values are deliberately absent. Support, effective adjacency, income and the four Aftermath counters are recomputed on demand, because storing them is how the map and the tracker come to disagree.
    architecture:
      classification: authoritative
      owner: game-host
      writers:
        - game-host
      replicas:
        - projected-player-view
        - projected-facilitator-view
    implementation:
      status: declared
      paths:
        - gui/rules/state.js
      symbols:
        - createInitialState
        - liegeChain
        - seatForToken
      tests:
        - npm test

  - component: game-host
    core:
      status: proposed
      confidence: confirmed
      title: Game Host
      summary: >-
        Owns authoritative state and the pipeline that changes it — admit,
        reduce, log, persist, reproject.
      rationale:
        - Facilitator overrides travel this same pipeline rather than mutating state directly, which keeps the game replayable from its seed and log and keeps "what did the umpire change?" answerable.
        - Knows nothing about the console that drives it or the transport that reaches it. That is what lets a co-facilitator build one from a mirrored log and carry on hosting.
    architecture:
      kind: host-coordinator
      authority: authoritative
      owns:
        - authoritative-game-state
        - clash-machine-state
        - consent-request-state
        - trade-contract-record
        - crown-holders
        - concession-record
        - rebellion-record
      coordinates:
        - command-admission
        - view-projector
      runs_in:
        - facilitator-browser-runtime
      persists:
        - authoritative-game-state
      depends_on:
        - authoritative-game-state
        - command-admission
        - view-projector
    implementation:
      status: declared
      paths:
        - gui/host/game-host.js
        - gui/host/persistence.js
      symbols:
        - GameHost
        - Persistence
        - parseSave
      tests:
        - npm test

  - component: facilitator-console
    core:
      status: proposed
      confidence: confirmed
      title: Facilitator Console
      summary: >-
        The umpire's page: start or resume a game, hold it, run the clock,
        speak for four foreign courts, override anything, and read the debrief.
      rationale:
        - Split from the host it drives, because the co-facilitator runs the same console without owning the game. Holding both in one entity made the console and the coordinator look like one thing and put them in a dependency cycle.
        - The PIN is shown here and nowhere else. The code gets shouted across a room; without a second secret anyone holding it could claim to be an umpire.
    architecture:
      kind: client-interface
      authority: authoritative
      reads:
        - authoritative-game-state
      runs_in:
        - facilitator-browser-runtime
      depends_on:
        - facilitator-session
        - game-host
        - authoritative-game-state
        - command-admission
        - client-connection-manager
        - shared-console-components
        - phase-clock
        - clash-resolution
        - envoy-negotiation
        - facilitator-override-inspector
        - crown-election
        - debrief-report
        - room-addressing
        - facilitator-map-editor
        - player-console
        - view-projector
    implementation:
      status: declared
      paths:
        - gui/host/host-app.js
      symbols:
        - startHostApp
      tests:
        - npm test

  - component: command-admission
    core:
      status: proposed
      confidence: confirmed
      title: Command Admission
      summary: >-
        The one place the rules are enforced. Decides whether a command is
        legal for this actor in this phase against this state, returning a
        human-readable reason when it is not.
      rationale:
        - Clients import the same admission functions to grey out unaffordable controls, but their answer is presentation only — the host's answer is the one that counts.
        - Commands whose legality depends on a secret the client cannot see are marked host-only, so a client renders them as available-but-unverified rather than guessing wrong.
        - Facilitator commands pass through admission too; theirs simply always admit, and their log entries are tagged as overrides.
    architecture:
      kind: rules-gate
      authority: authoritative
      classification: authoritative
      validates:
        - player-command-message
      reads:
        - authoritative-game-state
      depends_on:
        - authoritative-game-state
        - clash-resolution
      must_not_depend_on:
        - client-connection-manager
        - host-peer-listener
        - view-projector
    implementation:
      status: declared
      paths:
        - gui/rules/admission.js
        - gui/rules/commands.js
        - gui/rules/reducer.js
        - gui/rules/command-log.js
        - gui/rules/rng.js
      symbols:
        - admit
        - availableTo
        - apply
        - replay
      tests:
        - npm test

  - component: view-projector
    core:
      status: proposed
      confidence: confirmed
      title: View Projector
      summary: >-
        Builds each recipient's redacted copy of state by walking a declarative
        visibility manifest. Nothing leaves the host by any other route.
      rationale:
        - Redaction sprinkled across send sites fails open when someone adds a field; a manifest with a completeness test fails closed, because a path with no entry is a test failure.
        - The facilitator projection short-circuits to a full copy — they wrote the briefs and hold the state, so there is nothing to hide from them.
        - Reveal timing is expressed as a condition on a manifest entry rather than as branching in a send site, so a player cannot receive an opponent's card early even if their client misbehaves.
    architecture:
      kind: redaction
      authority: authoritative
      reads:
        - authoritative-game-state
      depends_on:
        - crown-and-support
      produces:
        - projected-player-view
        - projected-facilitator-view
        - projected-view-message
    implementation:
      status: declared
      paths:
        - gui/rules/views.js
        - gui/rules/visibility.js
      symbols:
        - projectView
        - unclassifiedPaths
        - auditProjection
        - FIELD_VISIBILITY
      tests:
        - npm test

  - component: shared-console-components
    core:
      status: proposed
      confidence: confirmed
      title: Shared Console Components
      summary: >-
        The two controls both consoles need: whether the game can still hear
        you, and who is in the room.
      rationale:
        - Neither console owns them, so neither should be where they live. Hanging them off the player console made the facilitator's page look like it depended on the player's.
        - The roster renders names people typed, which is the only free text in the game everyone else's browser displays, so it escapes rather than trusting.
    architecture:
      kind: client-interface
      authority: non-authoritative
    implementation:
      status: declared
      paths:
        - gui/components/rb-connection-dot.js
        - gui/components/rb-seat-roster.js
      symbols:
        - RbConnectionDot
        - RbSeatRoster
      tests:
        - npm test

  - component: player-console
    core:
      status: proposed
      confidence: confirmed
      title: Player Console
      summary: >-
        What a player looks at: the three printed sheets with the live game
        drawn over them, their own private sheet, and how England is doing.
      rationale:
        - Renders a projection and nothing else. It holds no game state, patches nothing and predicts nothing, so a reconnect costs nothing to reconcile -- the next projection is simply what is true now.
        - It cannot leak what it was never sent. Another player's resources are absent from the projection rather than present and hidden, so no rendering mistake could show them.
        - The map is the printed artwork with an SVG overlay sharing its viewBox. The outlines exist because a click needs a target and a faction needs a tint, not to replace a map that took an artist a long time.
    architecture:
      kind: client-interface
      authority: non-authoritative
      reads:
        - projected-player-view
      runs_in:
        - player-browser-runtime
      depends_on:
        - client-connection-manager
        - client-command-gateway
        - wire-protocol
        - room-addressing
        - shared-console-components
        - phase-clock
        - clash-resolution
        - envoy-negotiation
        - neighbour-consent
        - crown-election
    implementation:
      status: declared
      paths:
        - gui/client/player-app.js
        - gui/client/client-state.js
        - gui/client/load-data.js
        - gui/components/rb-map.js
        - gui/components/rb-private-sheet.js
        - gui/components/rb-aftermath.js
      symbols:
        - startPlayerApp
        - ClientState
        - RbMap
        - RbPrivateSheet
        - RbAftermath
      tests:
        - npm test

  - state: projected-player-view
    core:
      status: proposed
      confidence: confirmed
      title: Projected Player View
      summary: One player's redacted copy of state — the public map, their own sheet and brief, their team's private business, and nothing else.
    architecture:
      classification: replica
      derived_from:
        - authoritative-game-state
      owner: view-projector

  - state: projected-facilitator-view
    core:
      status: proposed
      confidence: confirmed
      title: Projected Facilitator View
      summary: A facilitator's copy of state, unredacted, plus the derived values the console displays.
      rationale:
        - The co-facilitator receives this too, which doubles as a warm standby copy of the game should the primary host die.
    architecture:
      classification: replica
      derived_from:
        - authoritative-game-state
      owner: view-projector

  - information: envoy-negotiation
    core:
      status: implemented
      confidence: confirmed
      title: Envoy Negotiation
      summary: >-
        A private thread between one player and the facilitator, who answers as
        the Franks, the Britons, the Danish Kings or the Pope.
      rationale:
        - Every envoy action on every printed sheet ends "by talking to an organiser", because the deal is a conversation rather than a table of prices. The action buys the hearing, not the outcome.
        - Private to its sender for the same reason a brief is. What Wessex offered Rome is exactly the sort of thing another player would pay to know.
    game_design:
      visibility: role-visible
      enforcement_links:
        - view-projector
      permitted_viewers:
        - owning-player
        - facilitator
    implementation:
      status: declared
      paths:
        - gui/components/rb-envoy-channel.js
        - gui/components/rb-envoy-queue.js
      symbols:
        - RbEnvoyChannel
        - RbEnvoyQueue
      tests:
        - npm test

  - component: facilitator-override-inspector
    core:
      status: implemented
      confidence: confirmed
      title: Facilitator Override Inspector
      summary: >-
        One card per role in human-readable terms -- resources as
        adjustments, claims, a mercenary card, an initiative token, and which
        shires they steward.
      rationale:
        - It exists because the app will get something wrong during a game, and the alternative to fixing it is a room of sixteen people watching an apology. A paper megagame never had this problem -- the umpire crosses out a number.
        - Every edit travels the same admission and reducer as a player's command, so it lands in the log tagged as an override and a replay reproduces it. Otherwise "the facilitator can change anything" would mean "the history is a polite fiction".
        - The seed, the cursor and the log itself are not editable. Changing one of those would make the record disagree with the game it describes, which is worse than any bug it could paper over.
        - Values keep their type on the way back in. A castle count that quietly became the string "3" would compare wrong everywhere afterwards and nobody would know why.
        - "A card started as a search box over dotted paths, which was complete but assumed the facilitator already knew the path to what they wanted. The cards name the things that actually come up in the words a sheet already uses, and a number is adjusted by an amount rather than replaced outright -- see numeric-adjustment -- so a facilitator's edit cannot silently undo a player's in the time between reading the value and committing a change to it. The search box is gone now that the cards, the shire editor and the Foreign Influence note between them cover everything it used to reach."
      references:
        - numeric-adjustment
        - mid-game-roster-edit
        - facilitator-map-editor
    architecture:
      kind: client-interface
      authority: non-authoritative
      reads:
        - projected-facilitator-view
      runs_in:
        - facilitator-browser-runtime
    implementation:
      status: declared
      paths:
        - gui/components/rb-state-inspector.js
      symbols:
        - RbStateInspector
      tests:
        - npm test

  - information: player-private-brief
    core:
      status: proposed
      confidence: confirmed
      title: Player Private Brief
      summary: A role's backstory, private goals and strategic hints. The paper rules say players must not show these to each other.
    game_design:
      visibility: role-visible
      enforcement_links:
        - view-projector
      permitted_viewers:
        - owning-player
        - facilitator

  - information: player-resource-holdings
    core:
      status: proposed
      confidence: confirmed
      title: Player Resource Holdings
      summary: A role's momentum, silver, food, soldiers, ships and wounds.
      rationale:
        - Nothing in the paper rules requires disclosure, and concealed strength is a negotiating lever, so these stay private by default rather than appearing on a public roster.
    game_design:
      visibility: role-visible
      enforcement_links:
        - view-projector
      permitted_viewers:
        - owning-player
        - facilitator

  - information: secret-tactic-selection
    core:
      status: proposed
      confidence: confirmed
      title: Secret Tactic Selection
      summary: The card a combatant has chosen for a clash, before the simultaneous reveal.
    game_design:
      visibility: role-visible
      enforcement_links:
        - view-projector
      permitted_viewers:
        - owning-player
        - facilitator
      reveal_conditions:
        - both-tactics-submitted

  - information: lead-the-charge-declaration
    core:
      status: proposed
      confidence: confirmed
      title: Lead The Charge Declaration
      summary: Whether a combatant is leading the charge, before the reveal that opens the amendment window.
    game_design:
      visibility: role-visible
      enforcement_links:
        - view-projector
      permitted_viewers:
        - owning-player
        - facilitator
      reveal_conditions:
        - both-lead-declarations-submitted

  - information: team-phase-initiative-target
    core:
      status: proposed
      confidence: confirmed
      title: Team Phase Initiative Target
      summary: The shire an initiative token holder intends to attack, decided at a team table before it is announced.
      rationale:
        - In the paper game this is protected by the teams sitting at separate tables, which is exactly a team-scoped audience.
    game_design:
      visibility: team-visible
      enforcement_links:
        - view-projector
      permitted_viewers:
        - same-team-player
        - facilitator
      reveal_conditions:
        - battle-phase-begun
