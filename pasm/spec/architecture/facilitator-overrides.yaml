entities:
  - mechanic: numeric-adjustment
    core:
      status: implemented
      confidence: confirmed
      title: Numeric Adjustment
      summary: >-
        A facilitator changes a number by an amount rather than replacing it,
        refused outright rather than clamped if the change would take it below
        zero.
      rationale:
        - "facilitator:set is a raw path-and-value override, which is exactly wrong for a number a player might also be changing: reading \"12\", typing \"15\", and committing a few seconds later overwrites whatever the player did in between, because \"15\" does not know it should have been \"was 12, plus a player's spend, plus three\". A delta has no such moment — it is applied against whatever the reducer is holding when the command actually reaches it, not whatever the facilitator saw on screen."
        - Validated against the live state at admission time rather than a value the client remembers, which is also what makes the same command correct for a co-facilitator whose mirror might be a beat behind the primary.
        - Refusing rather than clamping means a facilitator who tries to take twelve away from eight gets told no, not quietly given zero. A silently clamped edit is the app answering "yes" to a change that did not happen.
    implementation:
      status: declared
      paths:
        - gui/rules/commands/facilitator.js
      tests:
        - npm test
    evidence:
      - kind: test
        reference: tests/rules/facilitator-overrides.test.js
        summary: >-
          A delta commits correctly even after a player's own action changed
          the value in between, and a delta that would go negative is refused
          with the number actually in play.

  - mechanic: structured-shire-edits
    core:
      status: implemented
      confidence: confirmed
      title: Structured Shire Edits
      summary: >-
        Hand a shire to a steward, or take one back, with the shire's faction
        kept in step rather than left pointing at whoever used to hold it.
      rationale:
        - "A raw facilitator:set on stewardRoleId alone is a bug waiting to be filed: the shire's factionId is a second field that has to agree with it, the same way capture and swearTo already keep the two in step, and nothing else in the codebase writes stewardRoleId without also writing factionId."
    implementation:
      status: declared
      paths:
        - gui/rules/commands/facilitator.js
      tests:
        - npm test

  - mechanic: mid-game-roster-edit
    core:
      status: implemented
      confidence: confirmed
      title: Add Or Remove A Role Mid-Game
      summary: >-
        A facilitator can bring a dropped or never-seated role into a running
        game, prefilled from the printed sheet and editable before it commits,
        or take one back out with everything that could point at them cleared.
      rationale:
        - "\"Prefill from the starting rules, then let the facilitator modify before committing\" is a client-side concern rather than a server-side negotiation: the form fills in data.roles.roles[id].start, its printed claims and whichever shires the sheet names as its stewardship, the facilitator edits whatever they like, and one command carries the final values. There is no draft state on the host to go stale."
        - "Removing cascades rather than leaving dangling references: their shires go unheld, a seat playing them is freed, an initiative token or crown they held is cleared, and anyone sworn to them loses their liege exactly as though that liege had died without an heir — the same shape rebel and heir-arrives already use."
    game_design:
      participating_roles:
        - facilitator
    implementation:
      status: declared
      paths:
        - gui/rules/commands/facilitator.js
      tests:
        - npm test
    evidence:
      - kind: test
        reference: tests/rules/facilitator-overrides.test.js
        summary: >-
          A role built from the printed sheet plus whatever was committed
          lands with the right liege, faction and stewardship; removing one
          empties their shires, un-seats whoever was playing them, and frees
          any vassal sworn to them.

  - mechanic: facilitator-map-editor
    core:
      status: implemented
      confidence: confirmed
      title: The Facilitator's Pencil Over The Map
      summary: >-
        The facilitator's own tab shows the same map the players see, and
        every part of it is editable in place: a shire clicked there opens a
        card for steward, castles and ship value, and a settlement letter
        clicked opens a three-way state panel over the letter itself.
      rationale:
        - "The facilitator does not need a bespoke map component: a facilitator's projection is already defined as the full unredacted state plus derived, which is exactly what rb-map already renders for a player's redacted one. Feeding it projectView(state, data, { kind: 'facilitator' }) instead of a player's view is the entire integration."
        - "Claims are edited on the role's own card in the inspector, not here — a claim belongs to a role, not a shire, and duplicating that control on the map would just be a second place for the two to disagree. The shire editor owns only what is actually a shire's own field: steward, castles and ship value."
        - Castles and ship value are adjusted the same delta-and-commit way as every other facilitator number, for the same race-safety reason as numeric-adjustment — a steward's own spend and a facilitator's correction cannot silently overwrite one another.
        - Ship value is a delta on top of shipCostDelta rather than a replacement of the printed cost, so it stacks correctly with whatever a trade contract or a defensive fleet already did to the same field instead of clobbering it.
        - "A settlement is edited on the settlement rather than in a list on the shire's card. The card could only name them by type, so a shire with five churches offered five identical rows reading \"Church\" and no way to tell which church on the ground any of them meant. The letter is already drawn in the right place; clicking it is the only control that cannot be about the wrong one."
        - "Three radios — standing, defended, destroyed — rather than the two checkboxes this replaced. The states are exclusive in play and a pair of boxes could say otherwise: a settlement somebody has burned is not also one somebody is holding, and a form that lets an umpire tick both will eventually be ticked both."
        - "set-settlement still takes one field at a time, so the two transitions that cross the middle state are two commands, and clearing comes before setting. The other order would leave a settlement ringed and struck through in the gap between them, and leave it there if the second were refused; clearing first means a half-applied change is always one of the three legal states, one click from the one that was asked for."
        - "Editable is an attribute the facilitator's page grants rather than a capability the component infers. rb-map is mounted by both consoles and by the replay, and \"is there something in the card slot?\" is not the same question as \"may this person edit the board\" — a player's settlements have to stay ink on a map."
        - "The settlement half of this pencil is drawn by rb-map itself, which is declared under player-console because it is the one renderer both consoles share. It stays declared there rather than being claimed twice: the file has one owner, and what this entity adds to it is an attribute the owner honours, not a second copy of the component."
      references:
        - player-console
    game_design:
      participating_roles:
        - facilitator
    implementation:
      status: declared
      paths:
        - gui/components/rb-shire-editor.js
      symbols:
        - RbShireEditor
      tests:
        - npm test
    evidence:
      - kind: test
        reference: tests/components/shire-editor.test.js
        summary: >-
          Reassigning a steward keeps the shire's faction in step, a castle
          or ship-value commit round-trips as a delta and is refused when
          empty or zero, and ship value stacks on an existing shipCostDelta
          rather than replacing it.
      - kind: test
        reference: tests/components/views.test.js
        summary: >-
          A settlement letter on an editable map takes a click and offers its
          three states as radios; choosing one that needs two commands sends
          the clearing one first; choosing the state it is already in sends
          nothing; and without the editable attribute there is no hit target,
          no panel and no command — a click on a letter is a click on the
          shire under it.

  - message: adjust-command
    core:
      status: proposed
      confidence: confirmed
      title: Adjust
      summary: A path and a delta. Refused if the target is not a number or the result would be negative.
    architecture:
      authority: request
      producer:
        - client-command-gateway
      consumer:
        - command-admission
      validator:
        - command-admission
      trust_boundary: facilitator
      payload: path-and-delta

  - message: roster-edit-commands
    core:
      status: proposed
      confidence: confirmed
      title: Roster Edit Commands
      summary: set-steward, set-settlement, add-claim, remove-claim, assign-initiative, add-role and remove-role — the structured edits a role or shire card can make. Structured rather than unconditional — assign-initiative refuses to leave a role holding two of the three tokens, which is the one facilitator edit with an invariant of its own.
    architecture:
      authority: request
      producer:
        - client-command-gateway
      consumer:
        - command-admission
      validator:
        - command-admission
      trust_boundary: facilitator
      payload: varies-by-command
