entities:
  - mechanic: clash-resolution
    core:
      status: implemented
      confidence: confirmed
      title: Clash Resolution
      summary: >-
        One paired duel inside a battle, run as an explicit state machine —
        awaiting tactics, tactics revealed, awaiting lead declarations, lead
        revealed with an amendment window, rolling, rolls revealed, resolved.
      rationale:
        - This is the only part of the game with genuine simultaneous reveals, and the only place where a client behaving badly could cheat, so each reveal is enforced by the projector rather than by client etiquette.
        - The machine advances only inside the reducer. The amendment window's expiry is dispatched as a command rather than handled by a UI timer, so it appears in the log and replays identically.
        - Extra attackers with no opponent are seeded as already-resolved automatic wins at pairing time, so shire capture is one uniform tally rather than a special case.
        - "Each combatant throws their own die: rolls revealed is the stage the machine reaches the instant the second one lands, and it passes straight through it to resolved, so both the two-player path and a facilitator forcing a stalled clash forward reach the settlement through the same function."
        - "Who takes a fallen shire is the token holder's to say, not the umpire's: settleBattle reads the holder's own pick before it reaches for the caller's argument or the first attacker in pairing order."
      references:
        - lead-the-charge-ratchet
        - conquering-declaration-tie-break
    game_design:
      participating_roles:
        - attacking-combatant
        - defending-combatant
        - facilitator
    implementation:
      status: declared
      paths:
        - gui/rules/clash.js
        - gui/rules/battle.js
        - gui/components/rb-clash-panel.js
        - gui/components/rb-facilitator-grid.js
      symbols:
        - createClash
        - advanceClash
        - amendLead
        - resolveClash
        - settleClash
        - tally
        - settleBattle
        - heldBackToken
        - conqueringDeclaration
      tests:
        - npm test
    evidence:
      - kind: test
        reference: tests/rules/clash.test.js
        summary: >-
          The worked example printed in the Players Guide, reproduced exactly --
          six all, the attacker taking it on the tie, Alfred wounded by the six,
          and Guthrum starving one of the four he could not feed.

  - state: clash-machine-state
    core:
      status: proposed
      confidence: confirmed
      title: Clash Machine State
      summary: Which stage a single clash has reached, plus each side's submitted tactic, lead declaration, reinforcements and die.
      rationale:
        - The visibility manifest gates the tactic, lead and roll fields on this stage, so the machine's position is what makes a secret a secret.
        - All three are seeded per side as null rather than left empty, so "both sides have submitted" is one test the machine applies three times rather than three tests that could drift apart.
    architecture:
      classification: authoritative
      owner: game-host
      writers:
        - game-host

  - decision: lead-the-charge-ratchet
    core:
      status: implemented
      confidence: confirmed
      title: Lead The Charge Is A Ratchet
      summary: >-
        A combatant may switch to leading the charge after seeing their
        opponent's declaration, but never away from it. Amendment rounds
        therefore reach a fixpoint after at most two changes.
      rationale:
        - Read as a free two-way switch the paper rule never terminates, because each side would keep responding to the other. Read as monotone it terminates on its own, and that is what the rule actually says.
        - Admission rejects an amendment from leading back to not leading, which is what makes the fixpoint guaranteed rather than merely likely.
        - The countdown on the amendment window is therefore a courtesy to a player who has walked away, not a correctness requirement.
      assumptions:
        - Each side changes its declaration at most once, so the stage closes after at most two amendment rounds.
    implementation:
      status: declared
      paths:
        - gui/rules/clash.js
      symbols:
        - amendLead
      tests:
        - npm test
    evidence:
      - kind: test
        reference: tests/rules/clash.test.js
        summary: A downward amendment is refused, and the exchange reaches rolling after at most two upward ones.
      - kind: manual-review
        reference: two browsers over WebRTC
        summary: >-
          One fighter hung back, the other led, and the first was offered
          "join the charge" with no way back out.

  - decision: conquering-declaration-tie-break
    core:
      status: implemented
      confidence: confirmed
      title: One Declaration Owns A Battle, Chosen In Token Order
      summary: >-
        When more than one initiative token has declared the same shire, the
        earliest in white-black-bonus order is the declaration the battle is
        fought under — it takes the token a twice-winning defender seizes, and
        its holder is the one who names the new steward.
      rationale:
        - "Announce refuses while two live tokens name one shire, so a collision never reaches a battle. It still exists before one — this is read during the team phase too — and can arrive by routes announce never sees: a raw facilitator:set, or a save written before the rule."
        - "The collision is caught at announce rather than when a player declares, and the placement is the point: until targets are announced a declaration is its team's own business, so refusing a player for colliding would tell them which shire another team had secretly chosen. Announce is where declarations become public anyway, and where the facilitator — who can already see all three — is the one able to ask the loser to name somewhere else."
        - Every reader used to settle it with a first-match scan over the declarations, which answers with whichever was recorded first — an order that depends on the sequence commands arrived in and that nobody chose.
        - White and black are the counters the game starts with and the bonus is the temporary one handed to whoever sat the turn out, so the bonus should not outrank a token somebody has held all game.
        - "The alternative considered was letting any declarer name the steward with last write winning. It was rejected twice over: a shire's fate would turn on who clicked last, and the visibility manifest names one owning role per path, so a pick with two owners could not be scoped at all."
      assumptions:
        - A declaration left behind by a token nobody holds is not a live claim. Announce ignores it, because blocking on it would point the facilitator at a retarget control that itself refuses "nobody holds that token".
    implementation:
      status: declared
      paths:
        - gui/rules/battle.js
      symbols:
        - conqueringDeclaration
      tests:
        - npm test
    evidence:
      - kind: test
        reference: tests/rules/clash.test.js
        summary: >-
          White and black both declare Lindsey, written down in either order.
          The answer is white both times, only white's holder may name the
          steward, and white is the token that moves when the defence holds.

  - message: name-new-steward-command
    core:
      status: proposed
      confidence: confirmed
      title: Name New Steward
      summary: The initiative token holder's choice of who takes a shire their attack has brought down, changeable until the facilitator settles it.
      rationale:
        - The spoils belong to whoever spent the token. The facilitator used to pick from a dropdown of attackers, which quietly moved the most political decision of the battle phase off the table it belongs on.
        - Admitted only after the shire has actually fallen, because until the last clash is read there is nothing to give away, and only for somebody who attacked it, because a shire goes to somebody who was there for it.
    architecture:
      authority: request
      producer:
        - client-command-gateway
      consumer:
        - command-admission
      validator:
        - command-admission
      trust_boundary: client-to-host
      payload: shire-and-steward

  - message: submit-tactic-command
    core:
      status: proposed
      confidence: confirmed
      title: Submit Tactic
      summary: A combatant's choice of tactic card, freely changeable until both sides have submitted.
      rationale:
        - Admission rejects a card whose value exceeds the combatant's soldiers, which is the paper rule that stops a weakened player charging.
    architecture:
      authority: request
      producer:
        - client-command-gateway
      consumer:
        - command-admission
      validator:
        - command-admission
      trust_boundary: client-to-host
      payload: clash-and-card

  - message: submit-roll-command
    core:
      status: proposed
      confidence: confirmed
      title: Submit Roll
      summary: A combatant's own die for a clash, thrown once and never re-thrown.
      rationale:
        - Admission rejects a second die from the same combatant, which is what makes the throw a throw rather than a request for a number the player likes.
        - The die itself is drawn inside the reducer rather than sent in the payload, so a client cannot choose what it rolled.
    architecture:
      authority: request
      producer:
        - client-command-gateway
      consumer:
        - command-admission
      validator:
        - command-admission
      trust_boundary: client-to-host
      payload: clash-identifier

  - message: declare-lead-command
    core:
      status: proposed
      confidence: confirmed
      title: Declare Lead The Charge
      summary: A combatant's leadership declaration, and any later amendment to it.
    architecture:
      authority: request
      producer:
        - client-command-gateway
      consumer:
        - command-admission
      validator:
        - command-admission
      trust_boundary: client-to-host
      payload: clash-and-leading-flag

  - message: amend-window-expired-command
    core:
      status: proposed
      confidence: confirmed
      title: Amendment Window Expired
      summary: A host-originated command closing a clash's amendment window so the stage can advance without every combatant present.
      rationale:
        - Issued as a command rather than handled inline so the timeout is recorded in the log and a replay reproduces the same clash.
    architecture:
      authority: request
      producer:
        - game-host
      consumer:
        - command-admission
      validator:
        - command-admission
      trust_boundary: facilitator
      payload: clash-identifier
