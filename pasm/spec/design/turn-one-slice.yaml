entities:
  - role: owning-player
    core:
      status: proposed
      confidence: confirmed
      title: Owning Player
      summary: >-
        The player holding the role a given piece of private information
        belongs to. The audience of one for a brief, a resource total, or a
        tactic card before its reveal.

  - role: same-team-player
    core:
      status: proposed
      confidence: confirmed
      title: Same-Team Player
      summary: >-
        A player on the same starting team, and so party to what the paper game
        protects by seating the teams at separate tables.

  - role: facilitator
    core:
      status: proposed
      confidence: confirmed
      title: Facilitator
      summary: >-
        The umpire. Runs the clock, pairs clashes, roleplays the four
        non-played factions, and decides everything the rules leave to
        judgement.
      rationale:
        - Sees all information without exception, because they wrote the briefs and hold the only copy of state.

  - role: primary-facilitator
    core:
      status: proposed
      confidence: confirmed
      title: Primary Facilitator
      summary: The facilitator whose browser is the authoritative host and owns the phase clock.

  - role: co-facilitator
    core:
      status: proposed
      confidence: confirmed
      title: Co-Facilitator
      summary: >-
        The second facilitator. Adjudicates alongside the primary, and holds a
        full mirror of state that can be promoted to host if the primary dies.

  - role: attacking-combatant
    core:
      status: proposed
      confidence: confirmed
      title: Attacking Combatant
      summary: A player fighting on the attacking side of a clash. Wins ties.

  - role: defending-combatant
    core:
      status: proposed
      confidence: confirmed
      title: Defending Combatant
      summary: A player fighting on the defending side of a clash, possibly with a bonus from defended settlements.

  - role: settling-dane
    core:
      status: proposed
      confidence: confirmed
      title: Settling Dane
      summary: >-
        A Danish player asking to put down roots in a shire he already holds by
        force, which is the only way a Dane gains support anywhere.

  - role: danish-trader
    core:
      status: proposed
      confidence: confirmed
      title: Danish Trader
      summary: >-
        The one player holding the three trade contract cards, and the only one
        who can offer them.

  - role: adjacent-steward
    core:
      status: proposed
      confidence: confirmed
      title: Adjacent Steward
      summary: >-
        Whoever holds a shire bordering the one being settled. Their consent is
        required, and withholding it costs them nothing.

  - verb: claim-role
    core:
      status: proposed
      confidence: confirmed
      title: Claim Role
      summary: A seat takes an unheld character. Separate from identifying, so a seat can exist before it has a role and survive losing one.
    game_design:
      owner_role: owning-player
      architecture_links:
        - player-command-message
      enforcement_links:
        - command-admission

  - verb: declare-initiative-target
    core:
      status: proposed
      confidence: confirmed
      title: Declare Initiative Target
      summary: An initiative token holder names a shire they can reach and intend to attack, visible to their team until the battle phase announces it. Reachability is the same gate join-battle puts on an attacker, and a role may be holding only one of the three tokens at a time.
    game_design:
      owner_role: owning-player
      produces_facts:
        - initiative-target-declared
      architecture_links:
        - player-command-message
      enforcement_links:
        - command-admission

  - verb: join-battle
    core:
      status: proposed
      confidence: confirmed
      title: Join Battle
      summary: A player commits to a declared battle as an attacker or a defender, before the facilitator pairs the clashes.
    game_design:
      owner_role: owning-player
      architecture_links:
        - player-command-message
      enforcement_links:
        - command-admission

  - verb: submit-tactic
    core:
      status: proposed
      confidence: confirmed
      title: Submit Tactic
      summary: A combatant chooses a tactic card in secret, changeable until both sides have chosen.
    game_design:
      owner_role: owning-player
      produces_facts:
        - both-tactics-submitted
      architecture_links:
        - submit-tactic-command
      enforcement_links:
        - command-admission

  - verb: declare-lead
    core:
      status: proposed
      confidence: confirmed
      title: Declare Lead The Charge
      summary: A combatant declares whether they lead the charge, and may afterwards switch to leading but never away from it.
    game_design:
      owner_role: owning-player
      produces_facts:
        - both-lead-declarations-submitted
      architecture_links:
        - declare-lead-command
      enforcement_links:
        - command-admission

  - verb: submit-roll
    core:
      status: proposed
      confidence: confirmed
      title: Submit Roll
      summary: A combatant throws their own die for a clash, once, and the second die down settles it.
      rationale:
        - The die is drawn through the reducer's injected roll, so it advances the cursor stored in state and the throw survives a replay.
        - Two combatants racing to throw cannot diverge on replay, because the log records the order the host actually applied them in.
      assumptions:
        - A die once thrown is never thrown again, including by a facilitator forcing the clash forward.
    game_design:
      owner_role: owning-player
      produces_facts:
        - both-rolls-submitted
      architecture_links:
        - submit-roll-command
      enforcement_links:
        - command-admission

  - verb: transfer-stewardship
    core:
      status: proposed
      confidence: confirmed
      title: Transfer Stewardship
      summary: A steward hands a shire to another character during the team phase.
      rationale:
        - A real move rather than bookkeeping. Stewardship is what pays you, what you must defend, and -- through the support box -- what makes you legitimate, so giving one away is how a faction consolidates behind whoever can hold the border.
        - The shire's faction follows its steward, which is what moves it on the Danelaw and Disorder counters.
    game_design:
      owner_role: owning-player
      architecture_links:
        - player-command-message
      enforcement_links:
        - command-admission

  - verb: give-resources
    core:
      status: proposed
      confidence: confirmed
      title: Give Resources
      summary: Silver, food or ships pass from one character to another, at any time except during a battle, and in the team phase only within a faction.
      rationale:
        - This is a negotiating game, and the currency of a promise is being able to keep it on the spot.
        - Momentum and soldiers never move. They are what a character is rather than what they have.
        - The team phase is a team's own, so a gift aimed across the lines waits for the encounter or maintenance phase. The market is shut in that phase for the same reason, which is why trading with the bank is not a team-phase action at all.
    game_design:
      owner_role: owning-player
      architecture_links:
        - player-command-message
      enforcement_links:
        - command-admission

  - verb: reinforce-settlement
    core:
      status: proposed
      confidence: confirmed
      title: Reinforce Settlement
      summary: A momentum circles an undefended settlement, so it must be stormed rather than walked into.
      rationale:
        - "A priest may reinforce wherever a missionary cross stands, not only in shires they steward: it is the reward for having sent one."
    game_design:
      owner_role: owning-player
      architecture_links:
        - player-command-message
      enforcement_links:
        - command-admission

  - verb: facilitator-override
    core:
      status: proposed
      confidence: confirmed
      title: Facilitator Override
      summary: A facilitator sets any value in the game directly, including forcing a stalled clash forward.
      rationale:
        - Travels the same admission-and-reducer pipeline as a player command, so an override is replayable and shows up in the log rather than silently diverging the state from its history.
        - Forcing a clash forward past an absent combatant is the same fact as both sides having submitted, which is why this verb produces it.
        - It fills in only what is missing. A die a combatant has already thrown is kept, because re-throwing it under the guise of unsticking a clash is the one thing an umpire must not be able to do by accident.
    game_design:
      owner_role: facilitator
      produces_facts:
        - both-tactics-submitted
        - both-lead-declarations-submitted
        - both-rolls-submitted
      architecture_links:
        - player-command-message
      enforcement_links:
        - command-admission

  - verb: advance-phase
    core:
      status: proposed
      confidence: confirmed
      title: Advance Phase
      summary: The primary facilitator closes the current phase and opens the next, announcing it to everyone at once.
      rationale:
        - Announcing the battle targets is a consequence of this verb, which is why it is what releases the team-scoped initiative declarations to everyone.
    game_design:
      owner_role: primary-facilitator
      produces_facts:
        - battle-phase-begun
      architecture_links:
        - player-command-message
      enforcement_links:
        - command-admission

  - mechanic: phase-clock
    core:
      status: proposed
      confidence: confirmed
      title: Phase Clock
      summary: >-
        The turn structure — five turns of four hard-timed phases, five minutes
        each but ten for the encounter phase, advanced by the primary
        facilitator.
      rationale:
        - Derived from a wall-clock deadline rather than an accumulated tick count, so a backgrounded and throttled tab still shows the right remaining time.
        - The facilitator can pause, extend and advance, because a paper megagame's clock has always been a person with a watch and an opinion.
        - It runs past zero into overtime rather than stopping, and never advances a phase by itself. A phase ends when the facilitator calls it, which is how the paper game works and how every negotiation that has ever overrun gets to finish its sentence.
        - Pausing stores what was left rather than keeping the deadline, so five minutes spent settling a rules argument does not eat the phase it interrupted.
        - "The game is bracketed by two phases nobody plays in. The pregame is a phase of no length, held: not \"no clock at all\", which is what a null deadline gave and which left the facilitator's clock controls dead until the game started. Held at zero it cannot run out, so nothing beeps at a room that has not sat down, and the way out of it is the same Next phase that leaves any other. The postgame has no limit at all, because a debrief takes as long as it takes."
        - "Neither admits a player's game actions. `phases: '*'` means \"whenever the game is being played\" rather than \"always\": a vote or an envoy reply landing during the debrief would edit the record being read out, and one landing in the lobby would be playing a game that has not begun. Taking a character is the single exception and declares itself, because that is the whole business of the pregame and a late arrival needs it mid-game too."
        - "The clock is heard as well as seen. A facilitator running a room is listening to a negotiation across the table rather than watching a screen, so the deadline gets three beeps and every ten seconds of overtime gets one: three because three reads as a signal rather than a notification, and the nagging afterwards because past the deadline the question has changed from \"how long is left\" to \"are you going to call it\". A player hears a shorter noise of their own when the phase actually moves, that being the one thing in the game which happens to them rather than because of them."
        - "The component says when it has crossed a line and does not decide what that is worth, because both consoles mount it and only one of them makes a noise. Overtime is counted in whole ten-second steps with at most one event per render, so a facilitator who alt-tabs for three minutes hears one beep on their return rather than eighteen -- the same throttled-tab problem the wall-clock deadline exists to solve, wearing a different hat."
        - "Synthesised rather than sampled, so there is no audio file to fetch, to publish, or to 404 on a venue's wifi. Silent rather than broken wherever there is no audio to be had: a browser with sound off is not a fault a facilitator can fix mid-game, and the clock still says on screen everything the beep says out loud."
    game_design:
      participating_roles:
        - primary-facilitator
      architecture_links:
        - player-command-message
      enforcement_links:
        - command-admission
    implementation:
      status: declared
      paths:
        - gui/components/rb-phase-clock.js
        - gui/components/rb-action-list.js
      symbols:
        - RbPhaseClock
        - RbActionList
      tests:
        - npm test

  - resource: momentum
    core:
      status: proposed
      confidence: confirmed
      title: Momentum
      summary: The currency of special actions. Earned in the maintenance phase, capped at four, and never tradeable.
    game_design:
      owner_role: owning-player
      protected: true
      capacity: four
      sources:
        - two per maintenance phase for every archetype
        - one more for a Saxon Priest whose faction controls ten or more churches
      sinks:
        - reinforcing a settlement
        - raiding a settlement
        - missionary expeditions and rousing sermons
        - settling a shire and driving out missionaries
        - claiming a crown and rebelling against a liege
      must_not_be:
        - traded-between-players
        - accumulated-past-the-cap

  - resource: soldiers
    core:
      status: proposed
      confidence: confirmed
      title: Soldiers
      summary: Fighting strength, roughly a hundred troops each. Caps the tactic card a combatant may play, and must be fed after a clash or lost.
    game_design:
      owner_role: owning-player
      protected: true
      sources:
        - recruited for five silver
        - the mandatory pagan Danish upkeep payment
        - a rousing sermon from a Saxon Priest
        - raising Christian banners, once per game
      sinks:
        - casualties taken in a clash
        - going unfed after a clash
        - settling a shire
        - transferred to a liege on rebelling
      must_not_be:
        - traded-between-players

  - resource: silver
    core:
      status: proposed
      confidence: confirmed
      title: Silver
      summary: Income from towns. Buys ships, soldiers, envoys and rebuilt settlements. Tradeable outside the battle phase, and within your own faction during the team phase.
    game_design:
      owner_role: owning-player
      sources:
        - two per town held in a supported shire
        - raiding a town or a church
        - a trade contract paying out each maintenance phase
        - traded from another player
      sinks:
        - recruiting soldiers
        - building ships
        - sending an envoy to a non-played faction
        - rebuilding a destroyed settlement
        - settling a shire
        - the mandatory pagan Danish upkeep payment

  - resource: food
    core:
      status: proposed
      confidence: confirmed
      title: Food
      summary: Income from farms. Feeds soldiers after a clash. Tradeable outside the battle phase, and within your own faction during the team phase.
    game_design:
      owner_role: owning-player
      sources:
        - one per farm held in a supported shire
        - raiding a farm
        - traded from another player
      sinks:
        - feeding surviving soldiers after a clash
        - traded to another player

  - resource: ships
    core:
      status: proposed
      confidence: confirmed
      title: Ships
      summary: Bought access to coastal shires, and the price of an amphibious attack. Tradeable outside the battle phase, and within your own faction during the team phase.
    game_design:
      owner_role: owning-player
      sources:
        - built during the maintenance phase
        - traded from another player
      sinks:
        - buying adjacency to a coastal shire for a turn
        - committed to a defensive fleet
        - traded to another player
